name: notebooks
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gyptis=1.2.0
  - nannos=2.6.4
  - jaxlib=*=*cpu*  # nannos pulls jax and VTK; keep their CUDA builds (~500 MB) out of the image
  - viskores=*=*cpu*
  - trame-pyvista  # nannos sets the pyvista trame backend on import; pyvista>=0.49 moved it to this package
  - plotly=7.1.0  # interactive 3D figures; the site draws them with the matching plotly.js (Notebook.astro)
  - matplotlib
  - ipykernel
  - nbgitpuller  # the JupyterLab link pulls the notebook from main
  - setuptools>=82  # no pkg_resources: gyptis then uses its own shim instead of a deprecated, warning import
