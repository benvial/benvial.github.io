name: Deploy site

on:
  push:
    branches: [main]
  # Weekly rebuild (Monday 04:00 UTC) keeps the activity calendar on /code current.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # convert_publis.py needs pybtex to turn publis.bib into publications.json.
      - run: pip install pybtex==0.26.1
      - run: npm ci
      # Notebook outputs are generated, not committed. Re-run the notebooks only
      # when one of them or their environment changes: a cache hit skips the
      # gyptis install entirely.
      - id: notebooks
        uses: actions/cache@v4
        with:
          path: src/data/notebooks/executed
          key: notebooks-${{ hashFiles('src/data/notebooks/*.ipynb', 'binder/environment.yml', 'scripts/notebooks/execute.py') }}
      - if: steps.notebooks.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: binder/environment.yml
          create-args: nbclient pillow
      - if: steps.notebooks.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig"
          for nb in src/data/notebooks/*.ipynb; do python scripts/notebooks/execute.py "$nb"; done
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow on each run resets that timer.
  keepalive:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
